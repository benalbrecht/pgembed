[project]
name = "pgembed-pgsearch"
version = "0.27.0"
description = "ParadeDB pg_search BM25 full-text search extension for pgembed"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
dependencies = ["pgembed>=0.2.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pgembed_pgsearch"]

# The prebuilt extension binaries are staged into build-pgembed-pgsearch/ by CI
# (see .github/workflows/publish-pgembed-pgsearch.yml) before building.
[tool.setuptools.package-data]
pgembed_pgsearch = [
    "pg_search.so",
    "pg_search.dylib",
    "pg_search.control",
    "pg_search--*.sql",
    "lib*.so*",
    "lib*.dylib*",
    "THIRD_PARTY_LICENSES*",
]

[build-system]
requires = ["setuptools>=58.0.0", "wheel"]
build-backend = "setuptools.build_meta"
